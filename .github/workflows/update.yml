
name: Cập nhật kết quả

on:
  schedule:
    # 12:00-14:59 và 17:00-22:59 giờ VN (= 05-07 và 10-15 UTC), gồm chạy trước giờ quay để khóa dự đoán
    - cron: "*/5 5-7,10-15 * * *"
    # kiểm tra bù 2 lần mỗi ngày
    - cron: "30 2,15 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Kiểm tra bộ đọc dữ liệu và cấu trúc
        if: hashFiles('tests/**') != ''
        run: python3 -m unittest discover -s tests -t . -v

      - name: Lấy kết quả mới
        id: sync
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python3 server.py --sync-once

      # Kiểm tra lại dữ liệu SAU khi đồng bộ.
      # Không cho Analytics/Evaluation/Prediction chạy nếu dữ liệu không hợp lệ.
      - name: Kiểm tra toàn vẹn dữ liệu sau đồng bộ
        id: validate_data
        if: steps.sync.outcome == 'success'
        run: python3 -m unittest tests.test_data_integrity -v

      - name: Phân tích AI (tuỳ chọn)
        if: hashFiles('analyze.py') != ''
        continue-on-error: true
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python3 analyze.py

      - name: Analytics Engine — thống kê ba game
        id: analytics
        if: steps.sync.outcome != 'success' || steps.validate_data.outcome == 'success'
        continue-on-error: true
        run: python3 analytics.py

      - name: Evaluation Engine — walk-forward và đối chứng ngẫu nhiên
        id: evaluation
        if: steps.sync.outcome != 'success' || steps.validate_data.outcome == 'success'
        continue-on-error: true
        run: python3 evaluation.py

      - name: Prediction Engine — khóa 5 bộ và đối chiếu lịch sử
        id: prediction
        if: steps.sync.outcome == 'success' && steps.validate_data.outcome == 'success'
        continue-on-error: true
        run: python3 prediction.py

      - name: Lưu thay đổi
        run: |
          set -e
          git config user.name "vietlott-bot"
          git config user.email "bot@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Không có thay đổi để lưu."
            exit 0
          fi

          git commit -m "Cập nhật kết quả $(date -u +%F)"

          # Push có retry để xử lý trường hợp bot/commit khác cập nhật main cùng lúc.
          # Không force-push; nếu cùng sửa một tệp gây conflict thì dừng an toàn.
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              echo "Đã push thành công ở lần thử ${attempt}."
              exit 0
            fi

            if [ "$attempt" -eq 3 ]; then
              echo "::error::Push thất bại sau 3 lần thử."
              exit 1
            fi

            echo "Remote main đã thay đổi hoặc push tạm thời thất bại; fetch/rebase rồi thử lại (${attempt}/3)."
            git fetch origin main
            if ! git rebase origin/main; then
              git rebase --abort || true
              echo "::error::Rebase có conflict. Đã dừng để tránh ghi đè dữ liệu trên main."
              exit 1
            fi
            sleep 2
          done

      - name: Báo lỗi nếu thất bại
        if: steps.sync.outcome == 'failure' || steps.validate_data.outcome == 'failure' || steps.analytics.outcome == 'failure' || steps.evaluation.outcome == 'failure' || steps.prediction.outcome == 'failure'
        run: exit 1
