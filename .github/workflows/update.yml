name: Cập nhật kết quả

on:
  schedule:
    # 12:00-14:59 và 17:00-22:59 giờ VN (= 05-07 và 10-15 UTC), gồm chạy trước giờ quay để khóa dự đoán
    - cron: "*/5 5-7,10-15 * * *"
    # kiểm tra bù 2 lần mỗi ngày
    - cron: "30 2,15 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Kiểm tra bộ đọc dữ liệu
        if: hashFiles('tests/**') != ''
        run: python3 -m unittest discover -s tests -t . -v
      - name: Lấy kết quả mới
        id: sync
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python3 server.py --sync-once
      - name: Phân tích AI (tuỳ chọn)
        if: hashFiles('analyze.py') != ''
        continue-on-error: true
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python3 analyze.py
      - name: Analytics Engine — thống kê ba game
        id: analytics
        continue-on-error: true
        run: python3 analytics.py
      - name: Evaluation Engine — walk-forward và đối chứng ngẫu nhiên
        id: evaluation
        continue-on-error: true
        run: python3 evaluation.py
      - name: Prediction Engine — khóa 5 bộ và đối chiếu lịch sử
        id: prediction
        if: steps.sync.outcome == 'success'
        continue-on-error: true
        run: python3 prediction.py
      - name: Lưu thay đổi
        run: |
          git config user.name "vietlott-bot"
          git config user.email "bot@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || (git commit -m "Cập nhật kết quả $(date -u +%F)" && git push)
      - name: Báo lỗi nếu thất bại
        if: steps.sync.outcome == 'failure' || steps.analytics.outcome == 'failure' || steps.evaluation.outcome == 'failure' || steps.prediction.outcome == 'failure'
        run: exit 1
